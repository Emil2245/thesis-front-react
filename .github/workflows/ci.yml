name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
# E2E (Playwright) NO se ejecuta en CI: requiere el backend en ejecucion.
jobs:
  verify:
    env:
      NODE_OPTIONS: --no-experimental-webstorage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t propuestas-web:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: propuestas-web:ci
          severity: CRITICAL
          exit-code: "0"
