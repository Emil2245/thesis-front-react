name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
# E2E (Playwright, chromium) corre en CI: todos los specs mockean la API con page.route.
jobs:
  verify:
    env:
      NODE_OPTIONS: --no-experimental-webstorage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run e2e --project=chromium
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t propuestas-web:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: propuestas-web:ci
          severity: CRITICAL
          exit-code: "0"
